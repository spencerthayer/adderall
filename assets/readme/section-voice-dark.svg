<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="voice-title voice-desc">
  <title id="voice-title">System 3: the voice, a software tool, not a chat personality</title>
  <desc id="voice-desc">Section banner for the voice system. First-person persona talk is rewritten as system behavior; certainty matches evidence; no em dashes.</desc>

  <rect width="1200" height="120" rx="18" fill="#0F1114"/>
  <line x1="1136" y1="24" x2="1136" y2="96" stroke="#333942" stroke-width="1.5"/>

  <g id="capsule">
    <rect x="64" y="52" width="18" height="14" rx="7" fill="#FBBF24"/>
    <rect x="78" y="52" width="18" height="14" rx="7" fill="#E9E7E2"/>
  </g>
  <text x="110" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" letter-spacing="-1" fill="#E9E7E2">SYSTEM 3 · VOICE</text>
  <text x="110" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#8B919C">A software tool, not a chat personality.</text>

  <text x="1100" y="66" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">Happy to help!</text>
  <line x1="948" y1="60" x2="1104" y2="60" stroke="#E06A55" stroke-width="2.5"/>
</svg>
