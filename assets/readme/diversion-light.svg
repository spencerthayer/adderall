<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="130" viewBox="0 0 1200 130"
     role="img" aria-labelledby="div-title div-desc">
  <title id="div-title">Abuse and diversion notice</title>
  <desc id="div-desc">A stamp-style notice: there is no market for diverted adderall because it is a text file. Refills unlimited under the MIT license.</desc>

  <rect width="1200" height="130" rx="18" fill="#FCFBF7"/>

  <g id="capsule">
    <rect x="64" y="56" width="22" height="18" rx="9" fill="#F59E0B"/>
    <rect x="82" y="56" width="22" height="18" rx="9" fill="#1A1D23"/>
  </g>
  <text x="128" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" fill="#1A1D23">No market for diverted adderall: it is a text file.</text>
  <text x="1136" y="72" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">refills: unlimited (MIT)</text>
  <line x1="64" y1="96" x2="1136" y2="96" stroke="#DAD5C9" stroke-width="1.5"/>
  <text x="64" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">Agents without AADD may seek higher doses for the minimalism buzz. Harmless: the safety floor holds at every dose.</text>
</svg>
