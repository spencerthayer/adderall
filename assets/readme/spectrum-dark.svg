<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="240" viewBox="0 0 1200 240"
     role="img" aria-labelledby="spec-title spec-desc">
  <title id="spec-title">Therapeutic window across the dose range</title>
  <desc id="spec-desc">A dose spectrum from 5mg to 30mg. Below 7.5mg is undertreatment with creative deviations. 10mg to 15mg is the therapeutic band with 10mg as default. Above 20mg is overdosage where the agent halts on ambiguity.</desc>

  <rect width="1200" height="240" rx="18" fill="#0F1114"/>

  <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#E9E7E2">THERAPEUTIC WINDOW</text>
  <text x="1136" y="52" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">dose response</text>

  <g id="spectrum">
    <rect x="64" y="96" width="307" height="26" fill="#4A4F58"/>
    <rect x="371" y="96" width="460" height="26" fill="#FBBF24"/>
    <rect x="831" y="96" width="305" height="26" fill="#E9E7E2"/>
  </g>

  <g id="dose-ticks" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">
    <text x="64" y="152">5mg</text>
    <text x="217" y="152">7.5</text>
    <text x="371" y="152">10</text>
    <text x="524" y="152">12.5</text>
    <text x="677" y="152">15</text>
    <text x="831" y="152">20</text>
    <text x="1078" y="152">30mg</text>
  </g>

  <g id="zone-labels" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="217" y="196" text-anchor="middle" fill="#8B919C">undertreatment: deviations</text>
    <text x="601" y="196" text-anchor="middle" fill="#D99E26">therapeutic band · default 10mg</text>
    <text x="983" y="196" text-anchor="middle" fill="#E9E7E2">overdosage: halts on ambiguity</text>
  </g>

  <text x="600" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">Management: adjust the dose, not the ruleset.</text>
</svg>
