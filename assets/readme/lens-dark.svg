<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="220" viewBox="0 0 1200 220"
     role="img" aria-labelledby="lens-title lens-desc">
  <title id="lens-title">Co-administration: the dosage lens applied to a target skill</title>
  <desc id="lens-desc">A dose and a target skill combine into the dosage lens. The target skill is followed at the selected adherence while the safety floor stays intact and authority stays bounded.</desc>

  <rect width="1200" height="220" rx="18" fill="#0F1114"/>

  <g id="inputs">
    <rect x="64" y="64" width="250" height="64" rx="12" fill="#FBBF24"/>
    <text x="189" y="103" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#E9E7E2">/adderall-15mg</text>
    <text x="332" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#8B919C">+</text>
    <rect x="356" y="64" width="250" height="64" rx="12" fill="#171A1F" stroke="#E9E7E2" stroke-width="1.5"/>
    <text x="481" y="103" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#E9E7E2">/target-skill</text>
  </g>

  <g id="lens-arrow">
    <line x1="622" y1="96" x2="676" y2="96" stroke="#8B919C" stroke-width="2"/>
    <path d="M 668 89 l 10 7 l -10 7" fill="none" stroke="#8B919C" stroke-width="2"/>
    <text x="649" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">lens</text>
  </g>

  <g id="output">
    <rect x="692" y="64" width="444" height="64" rx="12" fill="#E9E7E2"/>
    <text x="914" y="96" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#0F1114">steps followed · deviations named ·</text>
    <text x="914" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#0F1114">one improvement max · safety floor intact</text>
  </g>

  <text x="600" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">The target skill cannot override system, user, platform, permission, or dosage instructions.</text>
</svg>
