<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="int-title int-desc">
  <title id="int-title">Co-administration interaction matrix</title>
  <desc id="int-desc">Three interactions. Target skills are compatible through the dose lens. Sycophancy skills and persona prompts are contraindicated. Over-requested features are built in full with no re-argument.</desc>

  <rect width="1200" height="300" rx="18" fill="#0F1114"/>

  <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#E9E7E2">INTERACTION MATRIX</text>
  <text x="1136" y="52" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">co-administration guidance</text>

  <g id="row-target">
    <text x="64" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#E9E7E2">Target skills</text>
    <rect x="736" y="104" width="400" height="32" rx="16" fill="none" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="936" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#D99E26">COMPATIBLE · DOSE LENS</text>
  </g>
  <line x1="64" y1="152" x2="1136" y2="152" stroke="#333942" stroke-width="1.5"/>

  <g id="row-sycophancy">
    <text x="64" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#E9E7E2">Sycophancy skills, persona prompts</text>
    <rect x="736" y="176" width="400" height="32" rx="16" fill="#E06A55"/>
    <text x="936" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#FFFFFF">CONTRAINDICATED</text>
  </g>
  <line x1="64" y1="224" x2="1136" y2="224" stroke="#333942" stroke-width="1.5"/>

  <g id="row-features">
    <text x="64" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#E9E7E2">Over-requested features</text>
    <rect x="736" y="248" width="400" height="32" rx="16" fill="none" stroke="#E9E7E2" stroke-width="1.5"/>
    <text x="936" y="270" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E9E7E2">BUILT IN FULL · NO RE-ARGUMENT</text>
  </g>
</svg>
