<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="240" viewBox="0 0 1200 240"
     role="img" aria-labelledby="eval-title eval-desc">
  <title id="eval-title">Clinical evaluation pipeline</title>
  <desc id="eval-desc">Four stages: 23 cases across shaping, minimality, voice, and dosage; paired runs of candidate against baseline; a blind judge with permuted labels; and a release gate requiring no correctness or safety regression.</desc>

  <rect width="1200" height="240" rx="18" fill="#0F1114"/>

  <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#E9E7E2">CLINICAL EVALUATION PIPELINE</text>
  <text x="1136" y="52" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">release gate</text>

  <g id="stage-cases">
    <rect x="64" y="92" width="240" height="72" rx="12" fill="#171A1F"/>
    <text x="184" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#E9E7E2">23 cases</text>
    <text x="184" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">shaping · minimal · voice</text>
  </g>
  <path d="M 312 128 l 18 0 m -8 -6 l 8 6 l -8 6" fill="none" stroke="#8B919C" stroke-width="2"/>

  <g id="stage-runs">
    <rect x="345" y="92" width="240" height="72" rx="12" fill="#171A1F"/>
    <text x="465" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#E9E7E2">paired runs</text>
    <text x="465" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">candidate vs baseline</text>
  </g>
  <path d="M 593 128 l 18 0 m -8 -6 l 8 6 l -8 6" fill="none" stroke="#8B919C" stroke-width="2"/>

  <g id="stage-judge">
    <rect x="626" y="92" width="240" height="72" rx="12" fill="#171A1F"/>
    <text x="746" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#E9E7E2">blind judge</text>
    <text x="746" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">permuted A/B labels</text>
  </g>
  <path d="M 874 128 l 18 0 m -8 -6 l 8 6 l -8 6" fill="none" stroke="#8B919C" stroke-width="2"/>

  <g id="stage-gate">
    <rect x="907" y="92" width="229" height="72" rx="12" fill="none" stroke="#FBBF24" stroke-width="2"/>
    <text x="1021" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#D99E26">release gate</text>
    <text x="1021" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">no safety regression</text>
  </g>

  <text x="600" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">No efficacy claim ships beyond this gate.</text>
</svg>
