<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="report-title report-desc">
  <title id="report-title">System 2: the report, action first</title>
  <desc id="report-desc">Section banner for the report system. The reply leads with the next action, numbers the steps, and ends with one concrete next action.</desc>

  <rect width="1200" height="120" rx="18" fill="#FCFBF7"/>
  <line x1="1136" y1="24" x2="1136" y2="96" stroke="#DAD5C9" stroke-width="1.5"/>

  <g id="capsule">
    <rect x="64" y="52" width="18" height="14" rx="7" fill="#F59E0B"/>
    <rect x="78" y="52" width="18" height="14" rx="7" fill="#1A1D23"/>
  </g>
  <text x="110" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" letter-spacing="-1" fill="#1A1D23">SYSTEM 2 · REPORT</text>
  <text x="110" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#66707E">Lead with the next action. End with one next action.</text>

  <text x="1100" y="66" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">as mentioned above</text>
  <line x1="908" y1="60" x2="1104" y2="60" stroke="#C24A3B" stroke-width="2.5"/>
</svg>
