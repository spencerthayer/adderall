<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="int-title int-desc">
  <title id="int-title">Co-administration interaction matrix</title>
  <desc id="int-desc">Three interactions. Target skills are compatible through the dose lens. Sycophancy skills and persona prompts are contraindicated. Over-requested features are built in full with no re-argument.</desc>

  <rect width="1200" height="300" rx="18" fill="#FCFBF7"/>

  <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#1A1D23">INTERACTION MATRIX</text>
  <text x="1136" y="52" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">co-administration guidance</text>

  <g id="row-target">
    <text x="64" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1A1D23">Target skills</text>
    <rect x="736" y="104" width="400" height="32" rx="16" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="936" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C08A1E">COMPATIBLE · DOSE LENS</text>
  </g>
  <line x1="64" y1="152" x2="1136" y2="152" stroke="#DAD5C9" stroke-width="1.5"/>

  <g id="row-sycophancy">
    <text x="64" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1A1D23">Sycophancy skills, persona prompts</text>
    <rect x="736" y="176" width="400" height="32" rx="16" fill="#C24A3B"/>
    <text x="936" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#FFFFFF">CONTRAINDICATED</text>
  </g>
  <line x1="64" y1="224" x2="1136" y2="224" stroke="#DAD5C9" stroke-width="1.5"/>

  <g id="row-features">
    <text x="64" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#1A1D23">Over-requested features</text>
    <rect x="736" y="248" width="400" height="32" rx="16" fill="none" stroke="#1A1D23" stroke-width="1.5"/>
    <text x="936" y="270" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#1A1D23">BUILT IN FULL · NO RE-ARGUMENT</text>
  </g>
</svg>
