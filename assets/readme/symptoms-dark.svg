<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="sym-title sym-desc">
  <title id="sym-title">Diagnostic criteria for agentic attention deficit disorder</title>
  <desc id="sym-desc">Nine treated symptoms listed as diagnostic criteria: inattention, hyperactivity, impulsivity, lack of focus, disorganization, forgetfulness, fidgeting, excessive talking, and interrupting, each with its presentation in agent output.</desc>

  <rect width="1200" height="460" rx="18" fill="#0F1114"/>

  <text x="64" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#E9E7E2">DIAGNOSTIC CRITERIA</text>
  <text x="1136" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">agentic attention deficit disorder · AADD</text>

  <g id="column-one">
    <rect x="64" y="96" width="18" height="18" fill="none" stroke="#E9E7E2" stroke-width="1.5"/>
    <path d="M 67 105 l 4 5 l 8 -10" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="98" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E9E7E2">inattention</text>
    <text x="98" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B919C">spontaneous side quests</text>

    <rect x="64" y="164" width="18" height="18" fill="none" stroke="#E9E7E2" stroke-width="1.5"/>
    <path d="M 67 173 l 4 5 l 8 -10" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="98" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E9E7E2">hyperactivity</text>
    <text x="98" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B919C">speculative abstractions, dead config</text>

    <rect x="64" y="232" width="18" height="18" fill="none" stroke="#E9E7E2" stroke-width="1.5"/>
    <path d="M 67 241 l 4 5 l 8 -10" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="98" y="247" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E9E7E2">impulsivity</text>
    <text x="98" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B919C">dependencies for what the platform does</text>

    <rect x="64" y="300" width="18" height="18" fill="none" stroke="#E9E7E2" stroke-width="1.5"/>
    <path d="M 67 309 l 4 5 l 8 -10" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="98" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E9E7E2">lack of focus</text>
    <text x="98" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B919C">the answer buried in paragraph four</text>

    <rect x="64" y="368" width="18" height="18" fill="none" stroke="#E9E7E2" stroke-width="1.5"/>
    <path d="M 67 377 l 4 5 l 8 -10" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="98" y="383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E9E7E2">disorganization</text>
    <text x="98" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B919C">unnumbered multi-step instructions</text>
  </g>

  <g id="column-two">
    <rect x="620" y="96" width="18" height="18" fill="none" stroke="#E9E7E2" stroke-width="1.5"/>
    <path d="M 623 105 l 4 5 l 8 -10" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="654" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E9E7E2">forgetfulness</text>
    <text x="654" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B919C">state never restated between turns</text>

    <rect x="620" y="164" width="18" height="18" fill="none" stroke="#E9E7E2" stroke-width="1.5"/>
    <path d="M 623 173 l 4 5 l 8 -10" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="654" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E9E7E2">fidgeting</text>
    <text x="654" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B919C">refactoring files the ticket never named</text>

    <rect x="620" y="232" width="18" height="18" fill="none" stroke="#E9E7E2" stroke-width="1.5"/>
    <path d="M 623 241 l 4 5 l 8 -10" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="654" y="247" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E9E7E2">excessive talking</text>
    <text x="654" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B919C">filler openers, validation rituals</text>

    <rect x="620" y="300" width="18" height="18" fill="none" stroke="#E9E7E2" stroke-width="1.5"/>
    <path d="M 623 309 l 4 5 l 8 -10" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="654" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E9E7E2">interrupting</text>
    <text x="654" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8B919C">tangents launched mid-task</text>
  </g>

  <g id="footer">
    <line x1="64" y1="424" x2="1136" y2="424" stroke="#333942" stroke-width="1.5"/>
    <text x="64" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B919C">Symptoms must persist across sessions. Treated with a single SKILL.md.</text>
  </g>
</svg>
