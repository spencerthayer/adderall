<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="dose-title dose-desc">
  <title id="dose-title">Adderall dosage strengths</title>
  <desc id="dose-desc">Seven doses from 5mg to 30mg plotted by adherence. Low doses are exploratory, mid doses balanced, high doses literal. 10mg is the default.</desc>

  <rect width="1200" height="380" rx="18" fill="#FCFBF7"/>

  <text x="64" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#1A1D23">DOSAGE STRENGTHS</text>
  <text x="1136" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">adherence by dose · band at right</text>

  <g id="lite-band">
    <text x="1000" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">lite</text>
    <text x="180" y="128" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#1A1D23">5mg</text>
    <rect x="200" y="112" width="70" height="16" rx="8" fill="#B9B4A6"/>
    <text x="282" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">0.10</text>
    <text x="180" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#1A1D23">7.5mg</text>
    <rect x="200" y="148" width="175" height="16" rx="8" fill="#B9B4A6"/>
    <text x="387" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">0.25</text>
  </g>

  <g id="full-band">
    <text x="1000" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C08A1E">full</text>
    <text x="180" y="218" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#1A1D23">10mg</text>
    <rect x="200" y="202" width="350" height="16" rx="8" fill="#F59E0B"/>
    <text x="562" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">0.50</text>
    <rect x="620" y="200" width="92" height="22" rx="11" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="666" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#C08A1E">DEFAULT</text>
    <text x="180" y="254" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#1A1D23">12.5mg</text>
    <rect x="200" y="238" width="490" height="16" rx="8" fill="#F59E0B"/>
    <text x="702" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">0.70</text>
    <text x="180" y="290" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#1A1D23">15mg</text>
    <rect x="200" y="274" width="595" height="16" rx="8" fill="#F59E0B"/>
    <text x="807" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">0.85</text>
  </g>

  <g id="ultra-band">
    <text x="1000" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#1A1D23">ultra</text>
    <text x="180" y="344" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#1A1D23">20mg</text>
    <rect x="200" y="330" width="665" height="16" rx="8" fill="#1A1D23"/>
    <text x="877" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">0.95</text>
    <text x="180" y="378" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#1A1D23">30mg</text>
    <rect x="200" y="364" width="700" height="16" rx="8" fill="#1A1D23"/>
    <text x="912" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#66707E">1.00</text>
  </g>
</svg>
